name: run-US-scraper

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * 5" # runs the job 4 times every Friday — at midnight, 6 AM, noon, and 6 PM UTC.
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr 
            any::janitor
            any::tidyr
            any::lubridate
            any::dotenv
            any::xml2
            any::jsonlite
            any::readr
            any::rvest
            any::stringr

      - name: Set up environment variables based on DATAWRAPPR secret
        run: echo "DW_API_KEY=${{ secrets.DATAWRAPPR }}" >> $GITHUB_ENV

      - name: Install DatawRappr package
        run: |
          Rscript -e "pak::pkg_install('munichrocker/DatawRappr')"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run script
        run: Rscript -e 'source("national_script.R")'
        
      - name: Run script
        run: Rscript -e 'source("cases.R")'
        
      - name: Run script
        run: Rscript -e 'source("vax-status.R")'

      - name: Commit results
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add national_script.R
          git commit -m 'ran national_script.R' || echo "No changes to commit"
          git push origin || echo "No changes to commit"